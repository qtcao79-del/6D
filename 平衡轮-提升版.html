<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平衡轮 · 飞昂叩启教练学院</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#2d2a26; --muted:#8a8378; --line:#e6e1d8;
  --a:#c96f4a; --a-dark:#b85c3a; --a-light:#e8a87c; --a-bg:#fdf3ee;
  --b:#3f9d63; --b-dark:#2f7d4c; --b-light:#7bc496; --b-bg:#eef7f1;
  --shadow-sm:0 1px 2px rgba(60,50,30,.04), 0 2px 8px rgba(60,50,30,.06);
  --shadow-md:0 4px 16px rgba(60,50,30,.08), 0 1px 3px rgba(60,50,30,.04);
  --shadow-lg:0 8px 30px rgba(60,50,30,.12), 0 2px 6px rgba(60,50,30,.06);
  --radius:14px; --radius-lg:20px; --radius-xl:24px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden !important;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6; font-size:15px; -webkit-font-smoothing:antialiased;
  touch-action:pan-y; overscroll-behavior-x:none;
}
@keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
.topbar{position:sticky; top:0; z-index:50; background:rgba(250,248,244,.88); backdrop-filter:blur(12px); border-bottom:1px solid rgba(230,225,216,.8);}
.topbar-inner{max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.brand{font-size:18px; font-weight:700; letter-spacing:.5px; flex:none; display:flex; align-items:center; gap:8px;}
.brand-logo{height:30px; width:auto; display:block;}
.brand-by{font-size:12px; font-weight:400; color:var(--muted); letter-spacing:0; white-space:nowrap;}
.members{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.chip{display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; min-height:34px; color:var(--muted); user-select:none; -webkit-user-select:none; transition:all .2s ease;}
.chip:hover{border-color:#d5cec2; background:#faf9f6;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; box-shadow:var(--shadow-sm);}
.chip-add{color:var(--a); font-weight:700;}
.chip-btn{border:none; background:transparent; cursor:pointer; font-size:11px; color:var(--muted); padding:2px 3px; min-width:22px; min-height:22px; font-family:inherit;}
.chip-btn:hover{color:var(--ink);}
.steps{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
.step-pill{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; min-height:38px; font-family:inherit; transition:all .2s ease;}
.step-pill:hover{border-color:#d5cec2; background:#faf9f6;}
.step-pill.active{background:linear-gradient(135deg,var(--a-light),var(--a)); border-color:transparent; color:#fff; font-weight:600; box-shadow:0 3px 10px rgba(201,111,74,.35);}
main{max-width:1080px; margin:0 auto; padding:20px 16px 28px; animation:fadeUp .35s ease;}
.layout{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:18px; align-items:start;}
.card{background:var(--card); border:1px solid rgba(230,225,216,.7); border-radius:var(--radius-lg); padding:18px 20px; box-shadow:var(--shadow-sm); transition:box-shadow .25s ease, transform .25s ease;}
.card:hover{box-shadow:var(--shadow-md);}
.stack>.card{margin-bottom:14px;}
h2{font-size:18px; margin:0 0 6px; font-weight:700; letter-spacing:-.2px;}
h3{font-size:15px; margin:0 0 10px; font-weight:600;}
.page-title{margin:0 0 4px; font-size:22px; letter-spacing:-.3px;}
.hint{font-size:13px; color:var(--muted); margin:4px 0 12px; line-height:1.5;}
.muted{color:var(--muted); font-weight:400; font-size:13px;}
.small{font-size:12.5px;}
.wheel-card{text-align:center;}
.wheel-card h2,.wheel-card .hint{text-align:left;}
.wheel-wrap{width:100%; text-align:center; position:relative;}
.wheel-wrap canvas{display:block; margin:0 auto; cursor:pointer; max-width:100%; user-select:none; -webkit-user-select:none;}
.solo{max-width:640px; margin:0 auto;}
.wheel-actions{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
.sel-count{font-size:12.5px; color:var(--muted);}
.label-menu{position:absolute; z-index:30; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 20px rgba(60,50,30,.16); padding:6px; min-width:104px; display:flex; flex-direction:column;}
.label-menu .lm-title{font-size:12px; color:var(--muted); padding:4px 10px 6px; border-bottom:1px dashed var(--line); margin-bottom:4px; text-align:center; font-weight:600;}
.label-menu button{border:none; background:transparent; font:inherit; font-size:14px; text-align:left; padding:9px 10px; border-radius:8px; cursor:pointer; min-height:38px;}
.label-menu button:hover{background:#f4f1e9;}
.label-menu button.lm-del{color:#b4443c;}
.owner-input{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; min-height:44px; background:#fffdf9; transition:border-color .2s ease, box-shadow .2s ease;}
.owner-input:focus{outline:none; border-color:var(--a); box-shadow:0 0 0 3px rgba(201,111,74,.15);}
.smart-guide{margin:0 0 12px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; box-shadow:var(--shadow-sm);}
.smart-guide summary{cursor:pointer; font-weight:600; min-height:32px;}
.guide-body{font-size:13.5px; color:#5d5442;}
.guide-body p{margin:8px 0;}
.goal-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:14px;}
.goal-col{padding:22px 20px; border-radius:var(--radius-lg); transition:box-shadow .25s ease, transform .25s ease;}
.goal-col:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px);}
.goal-ico{display:block; font-size:22px; margin-bottom:8px;}
.goal-col .goal-label{display:block; font-size:14px; font-weight:700; margin-bottom:8px;}
.goal-input{min-height:150px; border:none; background:transparent; padding:10px; border-radius:var(--radius);}
.goal-input:focus{outline:none; border:none; background:#fffdf9; box-shadow:0 0 0 3px rgba(201,111,74,.15);}
.goal-banner{display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,#fdf7ec,#fcf0dc); border:1px solid #f0ddbd; border-radius:var(--radius); padding:10px 14px; font-size:13.5px; cursor:pointer; margin:0 0 12px; min-height:44px; user-select:none; -webkit-user-select:none; box-shadow:var(--shadow-sm);}
.goal-banner .gb-line{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.goal-banner .gb-toggle{flex:none; font-size:12px; color:var(--a); font-weight:600;}
.goal-banner.empty{color:#a0662c; justify-content:center; font-weight:600;}
.goal-detail{background:#fffdf9; border:1px solid #f0ddbd; border-radius:var(--radius); padding:12px 16px; margin:-4px 0 12px; font-size:13.5px;}
.gb-row{display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line);}
.gb-row:last-of-type{border-bottom:none;}
.gb-row b{flex:none; width:200px; color:var(--muted); font-weight:600;}
.gb-row span{min-width:0; word-break:break-word;}
.gb-edit{margin-top:8px; color:var(--a); font-weight:600; cursor:pointer; font-size:13px;}
.smart-extra{margin:0 0 12px; border-top:1px dashed var(--line); padding-top:6px;}
.smart-extra summary{cursor:pointer; min-height:36px; color:var(--muted); font-weight:600; font-size:13.5px;}
.step-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:20px 0 0;}
.step-nav .btn{min-height:50px; min-width:120px; font-weight:600;}
.btn,.icon-btn,.step-pill,.chip,.lg-chip,.label-menu button{transition:all .2s ease;}
.btn:active,.icon-btn:active,.step-pill:active{transform:scale(.96);}
.btn:hover:not(:disabled){box-shadow:var(--shadow-md);}
.btn.primary:hover:not(:disabled){box-shadow:0 4px 14px rgba(201,111,74,.4);}
.legend{display:flex; justify-content:center; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-top:8px;}
.dot{display:inline-block; width:12px; height:12px; border-radius:3px; margin-left:12px; vertical-align:-1px;}
.dot:first-child{margin-left:0;}
.dot-a{background:var(--a);}
.dot-b{background:var(--b);}
.dim-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius); border:1px solid transparent; transition:background .2s ease;}
.dim-row.selected{background:var(--b-bg); border-color:#cfe3d5;}
.dim-row.clickable{cursor:pointer; user-select:none; -webkit-user-select:none;}
.dim-row.clickable:hover{background:#f5f3ee;}
.dim-row.clickable:active{background:#f0ede6;}
.dim-row.dim-disabled{opacity:.45;}
.dim-row input.name{flex:1; min-width:0; border:1px solid transparent; background:transparent; padding:8px; border-radius:10px; font:inherit; font-size:14px;}
.dim-row input.name:focus{border-color:var(--line); background:#fff; outline:none;}
.check{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:14px; color:#fff; flex:none; transition:all .2s ease;}
.dim-row.selected .check{background:var(--b); border-color:var(--b); box-shadow:0 2px 6px rgba(63,157,99,.3);}
.dim-name{flex:1; font-weight:600;}
.dim-cur{font-size:12.5px; color:var(--muted);}
.score{min-width:24px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums;}
.slider-row{display:flex; align-items:center; gap:10px; padding:4px 10px 10px 48px; font-size:13px; color:var(--muted);}
.slider-row input[type=range]{flex:1; min-height:44px; accent-color:var(--b);}
.tval{min-width:24px; text-align:center; color:var(--b-dark); font-size:15px; font-weight:600;}
.warn{color:#a0662c; background:#fdf3e4; border:1px solid #f0ddbd; padding:10px 14px; border-radius:var(--radius); font-size:13px; margin:0 0 10px;}
.banner{margin:0 0 14px; font-weight:600;}
.btn{min-height:44px; border-radius:12px; padding:10px 18px; font-size:14px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); font-family:inherit; font-weight:500;}
.btn:disabled{opacity:.4; cursor:default;}
.btn.primary{background:linear-gradient(135deg,var(--a-light),var(--a)); border-color:transparent; color:#fff; box-shadow:0 2px 8px rgba(201,111,74,.3); font-weight:600;}
.btn.danger{color:#b4443c; border-color:#e6c6c2;}
.btn.danger:hover{background:#fdf6f5;}
.icon-btn{width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--line); background:#faf8f3; font-size:17px; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; font-family:inherit;}
.icon-btn:hover{background:#f0ede6;}
.icon-btn:disabled{opacity:.35; cursor:default;}
.icon-btn.del,.icon-btn.snap-del{color:#b4443c;}
.cards-col{display:flex; flex-direction:column; gap:14px; margin-top:12px;}
.field{margin-bottom:14px;}
.field>label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
textarea{width:100%; min-height:56px; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; resize:vertical; background:#fffdf9; transition:border-color .2s ease, box-shadow .2s ease;}
textarea:focus,.task-text:focus,.date-input:focus{outline:none; border-color:var(--a); box-shadow:0 0 0 3px rgba(201,111,74,.12);}
.date-input{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; min-height:44px; background:#fffdf9;}
.task-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.task-text{flex:1; min-width:0; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:14px; min-height:44px; background:#fffdf9; transition:border-color .2s ease, box-shadow .2s ease;}
.toolbar{display:flex; gap:8px; flex-wrap:nowrap; margin:18px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none;}
.toolbar::-webkit-scrollbar{display:none;}
.toolbar .btn{flex:none; white-space:nowrap; min-height:42px; padding:8px 14px; font-size:13px;}
.prog-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); gap:16px;}
.prog-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.prog-head h3{margin:0; min-width:0; overflow-wrap:anywhere;}
.badge-days{font-size:12px; padding:4px 12px; border-radius:999px; background:#eef0ea; color:#6b6558; white-space:nowrap; font-weight:500;}
.badge-days.over{background:#fbe7e4; color:#b4443c; font-weight:600;}
.badge-days.soon{background:#fdf3e4; color:#a0662c; font-weight:600;}
.pbar{height:8px; background:#efece4; border-radius:999px; overflow:hidden; margin:12px 0 4px;}
.pbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--b-light),var(--b)); border-radius:999px; transition:width .3s ease;}
.smart-detail{margin:12px 0; font-size:13.5px;}
.smart-detail summary{cursor:pointer; min-height:36px; color:var(--muted); font-weight:600; padding:4px 0;}
.sm-row{display:flex; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line);}
.sm-row b{flex:none; width:110px; color:var(--muted); font-weight:600;}
.checklist{margin:8px 0;}
.check-row{display:flex; gap:10px; align-items:center; padding:6px 2px; min-height:44px;}
.check-row input[type=checkbox]{width:22px; height:22px; accent-color:var(--b); flex:none;}
.check-row .task-text{border-color:transparent; background:transparent;}
.check-row .task-text:focus{border-color:var(--a); background:#fffdf9;}
.check-row.done .task-text{text-decoration:line-through; color:var(--muted);}
.checkin-row{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap;}
.checkin-ok{color:var(--b-dark); font-weight:600; font-size:13.5px;}
.row-btns{display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; min-width:0;}
.row-btns .btn{flex:0 1 auto; min-width:0;}
.empty-card{text-align:center; padding:40px 20px; margin-top:14px;}
/* 历史 / 趋势 / 对比 */
#trendCanvas{display:block; width:100%; max-width:100%;}
.trend-legend{margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;}
.lg-chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; background:#fff; min-height:32px; user-select:none; -webkit-user-select:none; transition:all .2s ease;}
.lg-chip:hover{border-color:#d5cec2;}
.lg-chip.off{opacity:.38;}
.lg-dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none;}
.cmp-sels{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
select.cmp-sel{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; font:inherit; font-size:13px; min-height:44px; background:#fffdf9; max-width:45%; min-width:0;}
.cmp-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
.cmp-row:last-child{border-bottom:none;}
.cmp-name{width:64px; font-weight:600; flex:none;}
.diff{margin-left:auto; font-weight:700; font-size:12.5px; padding:3px 10px; border-radius:999px; white-space:nowrap;}
.diff.up{color:var(--b-dark); background:#e4f2e9;}
.diff.down{color:#b4443c; background:#fbe7e4;}
.diff.zero{color:var(--muted); background:#f0eee8;}
.snap-row{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; background:#fffdf9; box-shadow:var(--shadow-sm);}
.snap-head{display:flex; align-items:center; gap:10px;}
.snap-head b{flex:none; font-size:13.5px;}
.snap-sum{flex:1; font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.snap-note{margin-top:8px; font-size:13px;}
.snap-note summary{color:var(--muted); cursor:pointer; min-height:32px; line-height:1.4;}
.note-edit{margin-top:8px;}
.brand-footer{margin-top:16px; display:flex; align-items:center; justify-content:center; gap:18px; padding:14px 18px; background:linear-gradient(135deg,#ffffff,#fbf7ee); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.bf-logo{height:56px; width:auto; display:block;}
.bf-mid{text-align:left;}
.bf-text{margin:0 0 4px; font-size:13px;}
.bf-text b{font-weight:700;}
.bf-text.small{font-size:11.5px; color:var(--muted); margin:0 0 2px;}
.bf-link{color:var(--a); font-weight:700; text-decoration:underline; font-size:13px;}
.bf-link:hover{color:var(--a-dark);}
.bf-qrs{display:flex; align-items:center; gap:14px; flex:none;}
.bf-qr{text-align:center; font-size:11px; color:var(--muted); flex:none;}
.bf-qr img{width:64px; height:64px; border-radius:6px; border:1px solid var(--line); display:block; margin:0 auto 3px;}
.step-indicator{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px); background:rgba(45,42,38,.94); color:#fff; font-size:13.5px; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:99; max-width:86vw; text-align:center; box-shadow:var(--shadow-lg);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;}
  .brand{font-size:16px;}
  .brand-logo{height:26px;}
  .brand-by{font-size:11px;}
  .brand-footer{flex-direction:column; text-align:center; gap:10px; padding:12px 14px;}
  .bf-mid{text-align:center;}
  .bf-qrs{gap:10px;}
  .bf-qr img{width:56px; height:56px;}
  .topbar-inner{gap:8px; padding:8px 12px;}
  .members{width:100%;}
  .steps{margin-left:0; width:100%; gap:4px; flex-wrap:wrap;}
  .step-pill{flex:1 1 0; min-width:0; padding:6px 2px; font-size:11.5px; text-align:center; white-space:nowrap; overflow:hidden;}
  main{padding:14px 12px 24px;}
  .card{padding:16px;}
  .slider-row{padding-left:10px;}
  .prog-grid{grid-template-columns:minmax(0,1fr);}
  .goal-grid{grid-template-columns:minmax(0,1fr);}
  .prog-card{min-width:0; overflow-wrap:anywhere;}
  .gb-row{flex-direction:column; gap:2px;}
  .gb-row b{width:auto;}
  .page-title{font-size:20px;}
}

/* ================= 打印优化 ================= */
@media print{
  @page{ size:A4; margin:16mm 14mm; }
  *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{ background:#fff; }
  .topbar, .members, .steps, .toolbar, .step-nav, .toast, .warn.banner,
  .task-add, .checkin-btn, .achieve, .snap-del, .icon-btn,
  .btn, .chip-edit, .step-pill{ display:none !important; }
  main{ padding:0; max-width:none; }
  .card{ box-shadow:none; border:1px solid #ddd; border-radius:8px; page-break-inside:avoid; margin-bottom:12px; }
  .page-title{ font-size:22px; margin:0 0 8px; }
  .hint{ font-size:12px; color:#666; }
  .goal-banner{ border:1px solid #ddd; border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .goal-banner.empty{ display:none; }
  .prog-grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .prog-card{ border:1px solid #ddd; }
  .smart-detail summary{ display:none; }
  .smart-detail{ display:block; }
  .smart-detail .sm-row{ display:flex; padding:4px 0; font-size:12px; }
  .check-row{ display:flex; align-items:center; gap:6px; padding:3px 0; font-size:12px; }
  .check-row input[type="text"]{ border:none; background:transparent; font-size:12px; }
  .check-row input[type="checkbox"]{ pointer-events:none; }
  .task-check{ appearance:auto; }
  .badge-days{ font-size:11px; }
  .pbar{ height:6px; }
  .brand-footer{ margin-top:20px; padding:12px; border-top:1px solid #ddd; font-size:11px; color:#666; }
  .brand-footer img{ max-width:70px; }
  canvas{ max-width:100% !important; height:auto !important; }
}
</style>
</head>
<body>

<script>
'use strict';
/* ================= 数据与状态（v2：多成员） ================= */
const LS_KEY='balance-wheel-plus-v2';
const LS_KEY_V1='balance-wheel-plus-v1';
const COLOR_A='#c96f4a', COLOR_A_D='#a9552f', COLOR_B='#3f9d63', COLOR_B_D='#2f7d4c';
const FONT='-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const DEFAULT_NAMES=['健康','事业','家庭','财务','人际','成长','娱乐','环境'];
const PALETTE=['#c96f4a','#3f9d63','#4a7ec9','#c9a23f','#8a5fb0','#c94a6e','#3fa8a0','#7a9a3f','#a06a4a','#5d6db0','#b0532f','#2f8a5c'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidC=0; const uid=()=>'d'+Date.now().toString(36)+'_'+(uidC++);
const clampInt=(v,lo,hi)=>Math.max(lo,Math.min(hi,Math.round(Number(v)||0)));
const pad2=n=>String(n).padStart(2,'0');
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDateTime(ts){ const d=new Date(ts); return fmtDate(ts)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }

function defaultState(){
  return { step:1,
    dims: DEFAULT_NAMES.map((n,i)=>({id:'dim-'+(i+1), name:n, current:5, selected:false, target:null})),
    plans:{}, snapshots:[], checkins:[], goal:{goal:'',benefit:'',cost:''} };
}
function newMember(name){ return {id:uid(), name:name||'我', state:defaultState()}; }
let store=null, state=null;
function loadStore(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s && Array.isArray(s.members) && s.members.length){ store=s; return; }
  }catch(e){}
  /* 自动迁移 v1 数据为成员「我」 */
  let v1=null;
  try{ v1=JSON.parse(localStorage.getItem(LS_KEY_V1)); }catch(e){}
  const m=newMember('我');
  if(v1 && Array.isArray(v1.dims) && v1.dims.length>=3){
    m.state.dims=v1.dims;
    m.state.plans=v1.plans||{};
    m.state.step=v1.step||1;
  }
  store={active:m.id, members:[m]};
}
function activeMember(){
  let m=store.members.find(x=>x.id===store.active);
  if(!m){ m=store.members[0]; store.active=m.id; }
  return m;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function planFor(id){
  if(!state.plans[id]) state.plans[id]={specific:'',measurable:'',achievable:'',relevant:'',deadline:'',owner:'',tasks:[]};
  const p=state.plans[id];
  if(!Array.isArray(p.tasks)) p.tasks=[];
  if(p.owner==null) p.owner='';
  return p;
}
/* 不变量：0≤current≤10；target 为 null 或 current<target≤10 */
function normalize(){
  if(!Array.isArray(state.dims) || state.dims.length<3){ activeMember().state=defaultState(); state=activeMember().state; }
  state.plans=state.plans||{};
  if(!Array.isArray(state.snapshots)) state.snapshots=[];
  if(!Array.isArray(state.checkins)) state.checkins=[];
  state.dims.forEach(d=>{
    d.current=clampInt(d.current,0,10);
    if(d.target!=null){
      d.target=clampInt(d.target,0,10);
      if(d.target<=d.current){ d.target=null; d.selected=false; }
    }
  });
  state.step=clampInt(state.step==null?1:state.step,0,5);
  if(!state.goal) state.goal={goal:'',benefit:'',cost:''};
}

/* ================= 快照 / 打卡 ================= */
function takeSnapshot(note){
  const snap={ id:uid(), ts:Date.now(), note:note||'',
    dims:state.dims.map(d=>({name:d.name, current:d.current})),
    targets:state.dims.filter(d=>d.selected && d.target!=null).map(d=>({name:d.name, target:d.target})) };
  state.snapshots.push(snap);
  if(state.snapshots.length>50) state.snapshots=state.snapshots.slice(-50);
  save();
  return snap;
}
function mondayOf(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function checkinInfo(dimId){
  const list=state.checkins.filter(c=>c.dimId===dimId).map(c=>c.ts).sort((a,b)=>a-b);
  const last=list.length?list[list.length-1]:null;
  const thisMon=mondayOf(Date.now());
  const checkedThisWeek=last!=null && last>=thisMon;
  let streak=0;
  if(checkedThisWeek){
    let mon=thisMon;
    while(list.some(ts=>ts>=mon && ts<mon+7*864e5)){ streak++; mon-=7*864e5; }
  }
  const daysSince=last==null?null:Math.floor((Date.now()-last)/864e5);
  return {last, checkedThisWeek, streak, daysSince};
}

/* ================= 轮子绘制（扇形花瓣轮，非雷达图） ================= */
let hoverLabelId=null;
function geom(size){
  const labelPad=size<380?44:56;
  return {cx:size/2, cy:size/2, maxR:Math.max(60, size/2-labelPad)};
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawWheelInto(ctx,size,ox,oy,opts){
  opts=opts||{};
  const g=geom(size), cx=g.cx+ox, cy=g.cy+oy, maxR=g.maxR;
  const dims=state.dims, N=dims.length, stepA=Math.PI*2/N;
  const gap=Math.min(0.04, 0.6/N);
  const small=size<380;
  dims.forEach((d,i)=>{
    const a0=-Math.PI/2+i*stepA+gap/2, a1=-Math.PI/2+(i+1)*stepA-gap/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,maxR,a0,a1); ctx.closePath();
    ctx.fillStyle='rgba(93,84,66,.055)'; ctx.fill();
  });
  ctx.lineWidth=1;
  for(let v=2;v<=10;v+=2){
    ctx.beginPath(); ctx.arc(cx,cy,maxR*v/10,0,Math.PI*2);
    ctx.strokeStyle='rgba(93,84,66,.13)'; ctx.stroke();
  }
  dims.forEach((d,i)=>{
    const a0=-Math.PI/2+i*stepA+gap/2, a1=-Math.PI/2+(i+1)*stepA-gap/2;
    const rc=maxR*d.current/10;
    if(rc>0.5){
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,rc,a0,a1); ctx.closePath();
      ctx.fillStyle=COLOR_A; ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle=COLOR_A_D; ctx.stroke();
    }
    if(d.selected && d.target!=null && d.target>d.current){
      const rt=maxR*d.target/10;
      ctx.beginPath(); ctx.arc(cx,cy,rt,a0,a1); ctx.arc(cx,cy,Math.max(rc,0.1),a1,a0,true); ctx.closePath();
      ctx.fillStyle=opts.exportMode?'rgba(63,157,99,.88)':'rgba(63,157,99,.70)'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,rt,a0,a1);
      ctx.lineWidth=opts.exportMode?4:3; ctx.strokeStyle=COLOR_B_D; ctx.stroke();
    }
  });
  dims.forEach((d,i)=>{
    if(!d.selected) return;
    const a0=-Math.PI/2+i*stepA+gap/2, a1=-Math.PI/2+(i+1)*stepA-gap/2;
    const rr=maxR*Math.max(d.current, d.target||0)/10;
    ctx.save();
    ctx.shadowColor='rgba(63,157,99,.45)'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,Math.max(rr,2),a0,a1); ctx.closePath();
    ctx.lineWidth=2.5; ctx.strokeStyle=COLOR_B_D; ctx.stroke();
    ctx.restore();
  });
  ctx.font=(small?9:10)+'px '+FONT;
  for(let v=2;v<=10;v+=2){
    const x=cx+4, y=cy-maxR*v/10+1;
    const t=String(v), tw=ctx.measureText(t).width;
    roundRect(ctx,x-2,y-6,tw+4,12,4); ctx.fillStyle='rgba(246,244,239,.82)'; ctx.fill();
    ctx.fillStyle='#8a8378'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(t,x,y);
  }
  dims.forEach((d,i)=>{
    const mid=-Math.PI/2+(i+0.5)*stepA, cos=Math.cos(mid), sin=Math.sin(mid);
    const rc=maxR*d.current/10;
    if(rc>26){
      ctx.font='700 '+(small?12:14)+'px '+FONT;
      ctx.fillStyle='rgba(255,255,255,.95)'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(d.current), cx+cos*rc*0.55, cy+sin*rc*0.55);
    }
    if(d.selected && d.target!=null && d.target>d.current){
      const rt=maxR*d.target/10;
      if(rt-rc>18){
        ctx.font='700 '+(small?11:13)+'px '+FONT;
        ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('✓', cx+cos*(rc+rt)/2, cy+sin*(rc+rt)/2);
      }
      const label='↑'+(d.target-d.current);
      ctx.font='700 '+(small?10:11)+'px '+FONT;
      const bw=ctx.measureText(label).width+12, bh=17;
      let br=rt+13; if(br+bh/2>maxR+8) br=rt-15;
      let bx=cx+cos*br, by=cy+sin*br;
      bx=Math.max(ox+bw/2+2, Math.min(ox+size-bw/2-2, bx));
      by=Math.max(oy+bh/2+2, Math.min(oy+size-bh/2-2, by));
      roundRect(ctx,bx-bw/2,by-bh/2,bw,bh,8); ctx.fillStyle=COLOR_B; ctx.fill();
      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label,bx,by+0.5);
    }
  });
  /* 手柄圆点：第 1 步画现状分陶土点（全部维度），第 2 步画目标分绿点（选中维度） */
  if(opts.handles){
    dims.forEach((d,i)=>{
      const rr=(state.step===1)? d.current : (d.selected? d.target : null);
      if(rr==null || (state.step===2 && rr<=d.current)) return;
      const mid=-Math.PI/2+(i+0.5)*stepA;
      const rh=maxR*rr/10;
      const hx=cx+Math.cos(mid)*rh, hy=cy+Math.sin(mid)*rh;
      ctx.beginPath(); ctx.arc(hx,hy,small?6:7,0,Math.PI*2);
      ctx.fillStyle=state.step===1?COLOR_A:COLOR_B; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    });
  }
  dims.forEach((d,i)=>{
    const mid=-Math.PI/2+(i+0.5)*stepA, cos=Math.cos(mid), sin=Math.sin(mid);
    const lr=maxR+(small?14:18);
    let txt=d.name+' '+d.current;
    if(d.selected && d.target!=null) txt+='→'+d.target;
    ctx.font=((d.selected||opts.hoverLabel===d.id)?'700 ':'')+(small?11:12.5)+'px '+FONT;
    const tw=ctx.measureText(txt).width;
    let x=cx+cos*lr, y=cy+sin*lr, align;
    if(cos>0.35) align='left'; else if(cos<-0.35) align='right'; else align='center';
    if(align==='left') x=Math.min(x, ox+size-4-tw);
    else if(align==='right') x=Math.max(x, ox+4+tw);
    else x=Math.max(ox+4+tw/2, Math.min(ox+size-4-tw/2, x));
    ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillStyle=(opts.hoverLabel===d.id)?COLOR_A:(d.selected?COLOR_B_D:'#5d5442');
    ctx.fillText(txt,x,y);
  });
}
function drawCanvas(c){
  const size=+c.dataset.size, dpr=window.devicePixelRatio||1;
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  drawWheelInto(ctx,size,0,0,{handles:state.step===1||state.step===2, hoverLabel:hoverLabelId});
}
function sizeAndDraw(c){
  const wrap=c.parentElement;
  const css=Math.max(260, Math.min(wrap.clientWidth||320, 540));
  const dpr=window.devicePixelRatio||1;
  c.style.width=css+'px'; c.style.height=css+'px';
  c.width=Math.round(css*dpr); c.height=Math.round(css*dpr);
  c.dataset.size=css;
  drawCanvas(c);
}
function redrawWheel(){ const c=document.querySelector('#wheelWrap canvas'); if(c) drawCanvas(c); }
let rafPending=false;
function scheduleRedraw(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; redrawWheel(); });
}
function canvasHit(c,x,y){
  const size=+c.dataset.size, g=geom(size);
  const dx=x-g.cx, dy=y-g.cy, r=Math.hypot(dx,dy);
  if(r>g.maxR+6) return null;
  let t=Math.atan2(dy,dx)+Math.PI/2; if(t<0) t+=Math.PI*2;
  const N=state.dims.length;
  const idx=Math.min(N-1, Math.floor(t/(Math.PI*2/N)));
  const score=Math.max(0, Math.min(10, Math.round(r/g.maxR*10)));
  return {dim:state.dims[idx], score};
}
/* 维度名标签命中（轮外一圈） */
function labelHit(c,x,y){
  const size=+c.dataset.size, g=geom(size);
  const dx=x-g.cx, dy=y-g.cy, r=Math.hypot(dx,dy);
  if(r<g.maxR+2 || r>g.maxR+40) return null;
  let t=Math.atan2(dy,dx)+Math.PI/2; if(t<0) t+=Math.PI*2;
  const N=state.dims.length;
  return state.dims[Math.min(N-1, Math.floor(t/(Math.PI*2/N)))];
}
/* 目标/现状手柄命中（第 1 步：各维度现状分圆点；第 2 步：选中维度目标绿点） */
function handleHit(c,x,y){
  if(state.step!==1 && state.step!==2) return null;
  const size=+c.dataset.size, g=geom(size);
  const N=state.dims.length, stepA=Math.PI*2/N;
  for(let i=0;i<N;i++){
    const d=state.dims[i];
    const rr=(state.step===1)? d.current : (d.selected? d.target : null);
    if(rr==null || (state.step===2 && rr<=d.current)) continue;
    const mid=-Math.PI/2+(i+0.5)*stepA, rh=g.maxR*rr/10;
    if(Math.hypot(x-(g.cx+Math.cos(mid)*rh), y-(g.cy+Math.sin(mid)*rh))<=14) return d;
  }
  return null;
}
function closeLabelMenu(){ const m=document.querySelector('.label-menu'); if(m) m.remove(); }
function showLabelMenu(wrap, dim, x, y){
  closeLabelMenu();
  const menu=document.createElement('div');
  menu.className='label-menu';
  menu.innerHTML='<div class="lm-title">'+esc(dim.name)+'</div>'+
    '<button data-act="rename">改名</button>'+
    '<button data-act="del" class="lm-del">删除</button>'+
    '<button data-act="cancel">取消</button>';
  menu.style.left=Math.max(4, Math.min(x-52, wrap.clientWidth-116))+'px';
  menu.style.top=Math.max(4, y-10)+'px';
  menu.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    e.stopPropagation();
    const act=b.dataset.act;
    closeLabelMenu();
    if(act==='rename'){
      const v=prompt('维度名称（最多 8 字）：', dim.name);
      if(v && v.trim()){ dim.name=v.trim().slice(0,8); save(); render(true); }
    }else if(act==='del'){ delDim(dim); }
  });
  wrap.appendChild(menu);
}
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.label-menu')) closeLabelMenu(); }, true);
/* 触屏轻点（位移 <10px 才认定）：第 1 步按半径打分；第 2 步选中/设目标/取消 */
function wheelTap(c, wrap, x, y){
  const lb=labelHit(c,x,y);
  if(lb){ showLabelMenu(wrap, lb, x+(c.offsetLeft||0), y+(c.offsetTop||0)); return; }
  const h=canvasHit(c,x,y);
  if(!h) return;
  const size=+c.dataset.size, g=geom(size);
  const r=Math.hypot(x-g.cx, y-g.cy);
  if(state.step===1){ setScore(h.dim, h.score, true); return; }
  if(state.step===2){
    const d=h.dim;
    if(!d.selected){
      if(d.current>=10){ toast('「'+d.name+'」已是满分，无需设定提升目标'); return; }
      d.selected=true;
      d.target=Math.min(10, d.current+2);
      save(); render(true);
    }else{
      d.selected=false; d.target=null; save(); render(true);
    }
  }
}
function setupWheel(){
  const wrap=document.getElementById('wheelWrap');
  if(!wrap) return;
  wrap.innerHTML='';
  const c=document.createElement('canvas');
  wrap.appendChild(c);
  sizeAndDraw(c);
  c.style.touchAction='pan-y';
  let down=false, moved=false, sx=0, sy=0, downDim=null, dragTarget=null;
  const pos=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  const setTargetFromR=(dim,r,g)=>{
    if(!dim.selected) dim.selected=true;
    const v=Math.max(dim.current+1, Math.min(10, Math.round(r/g.maxR*10)));
    if(dim.target!==v) dim.target=v;
    scheduleRedraw();
  };
  c.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    e.preventDefault(); down=true; moved=false; downDim=null; dragTarget=null;
    try{ c.setPointerCapture(e.pointerId); }catch(_){}
    const p=pos(e); sx=p[0]; sy=p[1];
    if(state.step===1){
      const h=canvasHit(c,sx,sy); if(h) setScore(h.dim,h.score);
    }else if(state.step===2){
      const hd=handleHit(c,sx,sy);
      if(hd){ dragTarget=hd; return; }
      const h=canvasHit(c,sx,sy); if(h) downDim=h.dim;
    }
  });
  c.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch') return;
    const p=pos(e);
    if(!down){
      if(state.step===1||state.step===2||state.step===4){
        const lb=labelHit(c,p[0],p[1]);
        const id=lb?lb.id:null;
        if(id!==hoverLabelId){ hoverLabelId=id; drawCanvas(c); }
        const h=canvasHit(c,p[0],p[1]);
        c.style.cursor=(lb || (h && state.step!==4))?'pointer':'default';
      }
      return;
    }
    if(Math.hypot(p[0]-sx,p[1]-sy)>8) moved=true;
    if(state.step===1){
      const h=canvasHit(c,p[0],p[1]); if(h) setScore(h.dim,h.score);
    }else if(state.step===2){
      const size=+c.dataset.size, g=geom(size);
      const r=Math.hypot(p[0]-g.cx, p[1]-g.cy);
      if(dragTarget) setTargetFromR(dragTarget,r,g);
      else if(moved && downDim) setTargetFromR(downDim,r,g);
    }
  });
  c.addEventListener('pointerup',e=>{
    if(e.pointerType==='touch') return;
    if(!down) return; down=false;
    save();
    const p=pos(e);
    if(!moved){
      const lb=labelHit(c,p[0],p[1]);
      if(lb && (state.step===1||state.step===2||state.step===4)){
        showLabelMenu(wrap, lb, p[0]+(c.offsetLeft||0), p[1]+(c.offsetTop||0));
      }else if(state.step===2 && !dragTarget){
        const h=canvasHit(c,p[0],p[1]);
        if(h) toggleSelect(h.dim);
      }
    }
    downDim=null; dragTarget=null;
  });
  c.addEventListener('pointercancel',()=>{ down=false; downDim=null; dragTarget=null; save(); });
  /* 触屏专用手势：命中手柄→拖拽微调；扇形轻点→打分/选中；位移 ≥10px→视为页面滚动，不改分 */
  let tDownXY=null, tDrag=null;
  c.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0], r0=c.getBoundingClientRect();
    const x=t.clientX-r0.left, y=t.clientY-r0.top;
    tDownXY=[x,y]; tDrag=null;
    const hd=handleHit(c,x,y);
    if(hd){ e.preventDefault(); tDrag=hd; }
  },{passive:false});
  c.addEventListener('touchmove',e=>{
    const t=e.touches[0]; if(!t || !tDownXY) return;
    if(tDrag){
      e.preventDefault();
      const r0=c.getBoundingClientRect();
      const x=t.clientX-r0.left, y=t.clientY-r0.top;
      const size=+c.dataset.size, g=geom(size);
      const rr=Math.hypot(x-g.cx, y-g.cy);
      if(state.step===1) setScore(tDrag, Math.round(rr/g.maxR*10), false);
      else if(state.step===2) setTargetFromR(tDrag, rr, g);
    }
  },{passive:false});
  c.addEventListener('touchend',e=>{
    const t=e.changedTouches[0];
    const r0=c.getBoundingClientRect();
    const x=t.clientX-r0.left, y=t.clientY-r0.top;
    if(tDrag){ tDrag=null; tDownXY=null; save(); return; }
    if(tDownXY && Math.hypot(x-tDownXY[0], y-tDownXY[1])<10) wheelTap(c, wrap, x, y);
    tDownXY=null;
  });
}

function deadlineBadge(p){
  if(!p.deadline) return '<span class="badge-days">未设时限</span>';
  const diff=Math.ceil((new Date(p.deadline+'T23:59:59')-Date.now())/864e5);
  if(diff<0) return '<span class="badge-days over">已超期 '+(-diff)+' 天</span>';
  if(diff===0) return '<span class="badge-days soon">今天截止</span>';
  return '<span class="badge-days">剩余 '+diff+' 天</span>';
}

/* ================= 第 5 步：历史 ================= */
let trendHidden={}, cmpA=null, cmpB=null;
function trendNames(){
  const names=[];
  state.dims.forEach(d=>{ if(!names.includes(d.name)) names.push(d.name); });
  state.snapshots.forEach(s=>s.dims.forEach(d=>{ if(!names.includes(d.name)) names.push(d.name); }));
  return names;
}
function cmpTable(A,B){
  if(!A||!B) return '';
  const names=[];
  A.dims.concat(B.dims).forEach(d=>{ if(!names.includes(d.name)) names.push(d.name); });
  const get=(s,n)=>{ const d=s.dims.find(x=>x.name===n); return d?d.current:null; };
  const rows=names.map(n=>{
    const a=get(A,n), b=get(B,n);
    const diff=(a==null||b==null)?null:b-a;
    const badge=diff==null?'<span class="diff zero">—</span>':
      diff>0?'<span class="diff up">+'+diff+'</span>':
      diff<0?'<span class="diff down">'+diff+'</span>':'<span class="diff zero">±0</span>';
    return '<div class="cmp-row"><span class="cmp-name">'+esc(n)+'</span><span>'+(a==null?'—':a)+' → '+(b==null?'—':b)+'</span>'+badge+'</div>';
  }).join('');
  return '<div class="cmp-table">'+rows+'</div>';
}
function step5HTML(){
  const snaps=state.snapshots.slice().sort((a,b)=>a.ts-b.ts);
  let trendSec, cmpSec;
  if(snaps.length<2){
    trendSec='<div class="card"><h3>趋势图</h3><p class="hint">保存至少 2 份快照后，这里会显示各维度分数的变化趋势。前往「④ 追踪总览」点击「保存测评快照」即可开始记录。</p></div>';
    cmpSec='<div class="card"><h3>前后对比</h3><p class="hint">需要至少 2 份快照才能对比。</p></div>';
  }else{
    trendSec='<div class="card"><h3>趋势图（各维度分数变化）</h3>'+
      '<div id="trendWrap"><canvas id="trendCanvas"></canvas></div>'+
      '<div class="trend-legend" id="trendLegend"></div>'+
      '<p class="hint">点击图例可显示 / 隐藏对应维度的线条。</p></div>';
    if(!cmpA || !snaps.find(s=>s.id===cmpA)) cmpA=snaps[0].id;
    if(!cmpB || !snaps.find(s=>s.id===cmpB)) cmpB=snaps[snaps.length-1].id;
    const optHTML=selId=>snaps.map(s=>'<option value="'+s.id+'"'+(s.id===selId?' selected':'')+'>'+fmtDate(s.ts)+(s.note?' · '+esc(s.note.slice(0,8)):'')+'</option>').join('');
    const A=snaps.find(s=>s.id===cmpA), B=snaps.find(s=>s.id===cmpB);
    cmpSec='<div class="card"><h3>前后对比</h3>'+
      '<div class="cmp-sels"><select class="cmp-sel" data-which="a">'+optHTML(cmpA)+'</select><span>→</span>'+
      '<select class="cmp-sel" data-which="b">'+optHTML(cmpB)+'</select></div>'+
      cmpTable(A,B)+'</div>';
  }
  const rows=snaps.slice().reverse().map(s=>{
    const sum=s.dims.map(d=>d.name+d.current).join(' ');
    return '<div class="snap-row">'+
      '<div class="snap-head"><b>'+fmtDateTime(s.ts)+'</b><span class="snap-sum">'+esc(sum)+'</span>'+
      '<button class="icon-btn snap-del" data-sid="'+s.id+'" aria-label="删除快照">✕</button></div>'+
      '<details class="snap-note"><summary>'+(s.note?esc(s.note):'（无复盘笔记，点击添加）')+'</summary>'+
      '<textarea class="note-edit" data-sid="'+s.id+'" placeholder="这次测评的感受 / 原因…">'+esc(s.note)+'</textarea></details></div>';
  }).join('');
  return '<h2 class="page-title">第 5 步 · 历史与复盘</h2>'+
    '<p class="hint">快照记录每次测评（第 4 步可保存），观察长期变化；最多保留 50 份。</p>'+
    goalBannerHTML()+
    '<div class="stack">'+trendSec+cmpSec+
    '<div class="card"><h3>快照列表（'+snaps.length+'/50）</h3>'+(rows||'<p class="hint">还没有快照。</p>')+'</div></div>'+navHTML();
}

function setScore(d,v,commit){
  d.current=clampInt(v,0,10);
  if(d.target!=null && d.target<=d.current){ d.target=null; d.selected=false; }
  if(commit) save();

}
function toggleSelect(d){
  if(d.selected){ d.selected=false; d.target=null; }
  else{
    if(d.current>=10){ toast('「'+d.name+'」已是满分，无需设定提升目标'); return; }
    d.selected=true; d.target=Math.min(10, d.current+2);

}
function addDim(){
  if(state.dims.length>=12){ toast('最多 12 个维度'); return; }
  state.dims.push({id:uid(), name:'新维度', current:5, selected:false, target:null});

function delDim(d){

  if(!confirm('确定删除维度「'+d.name+'」吗？其行动计划也会一并删除。')) return;

/* ================= 趋势图 ================= */
function setupTrend(){
  const c=document.getElementById('trendCanvas');
  if(!c) return;
  const wrap=c.parentElement;
  const w=Math.max(260, Math.min(wrap.clientWidth||320, 960));
  const h=Math.max(220, Math.min(300, Math.round(w*0.45)));
  const dpr=window.devicePixelRatio||1;
  c.style.width=w+'px'; c.style.height=h+'px';
  c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
  c.dataset.w=w; c.dataset.h=h;
  drawTrend(c);
  renderTrendLegend();
}
function drawTrend(c){
  const snaps=state.snapshots.slice().sort((a,b)=>a.ts-b.ts);
  const w=+c.dataset.w, h=+c.dataset.h, dpr=window.devicePixelRatio||1;
  const ctx=c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const padL=30, padR=10, padT=12, padB=26;
  const pw=w-padL-padR, ph=h-padT-padB;
  ctx.font='10px '+FONT; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let v=0;v<=10;v+=2){
    const y=padT+ph*(1-v/10);
    ctx.strokeStyle='rgba(93,84,66,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle='#8a8378'; ctx.fillText(String(v), padL-6, y);
  }
  const n=snaps.length;
  const X=i=>n===1?padL+pw/2:padL+pw*i/(n-1);
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#8a8378';
  const stepLbl=Math.max(1, Math.ceil(n/6));
  snaps.forEach((s,i)=>{
    if(i%stepLbl===0 || i===n-1){
      const d=new Date(s.ts);
      ctx.fillText((d.getMonth()+1)+'/'+d.getDate(), X(i), padT+ph+6);
    }
  });
  const names=trendNames();
  names.forEach((name,ni)=>{
    if(trendHidden[name]) return;
    const color=PALETTE[ni%PALETTE.length];
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    let started=false;
    snaps.forEach((s,i)=>{
      const d=s.dims.find(x=>x.name===name); if(!d) return;
      const x=X(i), y=padT+ph*(1-d.current/10);
      if(!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    });
    ctx.stroke();
    snaps.forEach((s,i)=>{
      const d=s.dims.find(x=>x.name===name); if(!d) return;
      const x=X(i), y=padT+ph*(1-d.current/10);
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
    });
  });
}
function renderTrendLegend(){
  const el=document.getElementById('trendLegend');
  if(!el) return;
  const names=trendNames();
  el.innerHTML=names.map((n,i)=>
    '<span class="lg-chip'+(trendHidden[n]?' off':'')+'" data-name="'+esc(n)+'">'+
    '<span class="lg-dot" style="background:'+PALETTE[i%PALETTE.length]+'"></span>'+esc(n)+'</span>').join('');
}

/* ================= 事件绑定（委托） ================= */
document.getElementById('app').addEventListener('click',e=>{
  const lg=e.target.closest('.lg-chip');
  if(lg){
    const n=lg.dataset.name;
    trendHidden[n]=!trendHidden[n];
    const c=document.getElementById('trendCanvas');
    if(c) drawTrend(c);
    renderTrendLegend();
    return;
  }
  const dg=e.target.closest('[data-goto]');
  if(dg){ gotoStep(+dg.dataset.goto); return; }
  const gb=e.target.closest('.goal-banner');
  if(gb){ goalOpen=!goalOpen; render(true); return; }
  const t=e.target.closest('button');
  if(!t) return;
  if(t.classList.contains('nav-prev')){ gotoStep(state.step-1); return; }
  if(t.classList.contains('nav-next')){ gotoStep(state.step+1); return; }
  const id=t.dataset.id;
  const d=id?state.dims.find(x=>x.id===id):null;
  if(t.id==='btnAddDim'){ addDim(); return; }
  if(t.classList.contains('task-add')&&d){ planFor(d.id).tasks.push({text:'',done:false}); save(); render(true); focusLastTask(d.id); return; }
  if(t.classList.contains('task-del')&&d){ planFor(d.id).tasks.splice(+t.dataset.idx,1); save(); render(true); return; }
  if(t.classList.contains('achieve')&&d){ achieve(d); return; }
  if(t.classList.contains('checkin-btn')&&d){
    state.checkins.push({dimId:d.id, ts:Date.now()});
    save(); render(true);
    toast('「'+d.name+'」本周打卡成功 ✓');
    return;
  }
  if(t.classList.contains('snap-del')){
    const sid=t.dataset.sid;
    if(!confirm('确定删除这份快照吗？')) return;
    state.snapshots=state.snapshots.filter(s=>s.id!==sid);
    save(); render(true);
    return;
  }
  if(t.id==='btnSnap'){
    takeSnapshot('');
    toast('快照已保存，可到「⑤ 历史」查看');
    return;
  }
  if(t.id==='btnExport'){ exportLongImage(); return; }
  if(t.id==='btnPDF'){ exportPDF(); return; }
  if(t.id==='btnShare'){ shareResult(); return; }
  if(t.id==='btnReset'){ resetAll(); return; }
});
document.getElementById('app').addEventListener('input',e=>{
  const t=e.target, id=t.dataset.id;
  if(t.classList.contains('goal-input')){ state.goal[t.dataset.g]=t.value; save(); return; }
  if(t.classList.contains('task-text')&&id){
    const p=planFor(id), i=+t.dataset.idx;
    if(p.tasks[i]){ p.tasks[i].text=t.value; save(); }
    return;
  }
  if(t.classList.contains('note-edit')){
    const s=state.snapshots.find(x=>x.id===t.dataset.sid);
    if(s){ s.note=t.value; save(); }
    return;
  }
  if(t.dataset.f&&id){ planFor(id)[t.dataset.f]=t.value; save(); }
});
document.getElementById('app').addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('task-check')){
    const p=planFor(t.dataset.id), i=+t.dataset.idx;
    if(p.tasks[i]){ p.tasks[i].done=t.checked; save(); render(true); }
    return;
  }
  if(t.classList.contains('cmp-sel')){
    if(t.dataset.which==='a') cmpA=t.value; else cmpB=t.value;
    render(true);
    return;
  }
  if(t.dataset.f==='deadline'&&t.dataset.id){ planFor(t.dataset.id).deadline=t.value; save(); }
});
document.getElementById('memberChips').addEventListener('click',e=>{
  const editBtn=e.target.closest('.chip-edit');
  if(editBtn){
    const m=store.members.find(x=>x.id===editBtn.dataset.mid);
    if(m){ const v=prompt('成员姓名：', m.name); if(v && v.trim()){ m.name=v.trim().slice(0,8); save(); render(true); } }
    return;
  }
  const delBtn=e.target.closest('.chip-del');
  if(delBtn){
    const m=store.members.find(x=>x.id===delBtn.dataset.mid);
    if(!m) return;
    if(store.members.length<=1){ toast('至少保留 1 个成员'); return; }
    if(!confirm('确定删除成员「'+m.name+'」吗？其全部数据将被删除。')) return;
    store.members=store.members.filter(x=>x.id!==m.id);
    if(store.active===m.id) store.active=store.members[0].id;
    state=activeMember().state;
    save(); render(true);
    return;
  }
  if(e.target.closest('#chipAdd')){
    const v=prompt('新成员姓名：','');
    if(v && v.trim()){
      const m=newMember(v.trim().slice(0,8));
      store.members.push(m);
      store.active=m.id;
      state=m.state;
      save(); render(false);
      toast('已添加成员「'+m.name+'」');
    }
    return;
  }
  const chip=e.target.closest('.chip');
  if(chip && chip.dataset.mid && chip.dataset.mid!==store.active){
    store.active=chip.dataset.mid;
    state=activeMember().state;
    save(); render(false);

/* ================= 导出 PNG ================= */
async function shareResult(){
  const url=location.href.split('?')[0].split('#')[0];
  const goal=state.goal&&state.goal.goal?state.goal.goal.trim():'';
  const sel=state.dims.filter(d=>d.selected && d.target!=null);
  const lines=sel.map(d=>d.name+'：'+d.current+' → '+d.target).join('\n');
  const text='【平衡轮 · 追踪总览】\n'+
    '成员：'+activeMember().name+'\n'+
    (goal?'目标：'+goal+'\n':'')+
    (lines?'提升维度：\n'+lines+'\n':'')+
    '—— 飞昂叩启教练学院 · 平衡轮';
  const payload={ title:'平衡轮 · 飞昂叩启教练学院', text:text, url:url };
  if(navigator.share){
    try{ await navigator.share(payload); toast('已调起系统分享'); }
    catch(err){ if(err.name!=='AbortError') toast('分享失败，已复制链接'); }
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(text+'\n'+url);
      toast('分享文案已复制，可粘贴发送');
    }catch(err){ fallbackCopy(text+'\n'+url); }
  }else{
    fallbackCopy(text+'\n'+url);
  }
}
function fallbackCopy(str){
  const ta=document.createElement('textarea');
  ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('分享文案已复制'); }
  catch(e){ toast('复制失败，请手动复制链接'); }
  ta.remove();
}

function wrapText(ctx, text, maxWidth){
  const lines=[]; let line='';
  for(const ch of String(text)){
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=ch; }
    else line=test;
  }
  if(line) lines.push(line);
  return lines;
}
function drawSectionTitle(ctx, text, x, y){
  ctx.fillStyle=COLOR_A; ctx.beginPath(); ctx.arc(x+6, y-6, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#2d2a26'; ctx.font='700 17px '+FONT; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(text, x+20, y);
  return y+24;
}
function buildLongCanvas(){
  const sel=state.dims.filter(d=>d.selected && d.target!=null);
  const scale=2, W=1000, pad=48, wheelS=520;
  const ds=fmtDate(Date.now());
  const lines=sel.map(d=>{
    const p=planFor(d.id);
    const total=p.tasks.length, done=p.tasks.filter(t=>t.done).length;
    const pct=total?Math.round(done/total*100):0;
    let days='未设时限';
    if(p.deadline){
      const diff=Math.ceil((new Date(p.deadline+'T23:59:59')-Date.now())/864e5);
      days=diff<0?('已超期 '+(-diff)+' 天'):(diff===0?'今天截止':('剩余 '+diff+' 天'));
    }
    return {d, p, done, total, pct, days};
  });
  // 预估高度
  let estH=pad+40+wheelS+40;
  estH+=40; // 目标
  estH+=40; // 提升维度标题
  lines.forEach(L=>{
    estH+=30; // 维度行
    estH+=30; // SMART 标题
    ['specific','measurable','achievable','relevant'].forEach(f=>{
      estH+=wrapText({measureText:t=>({width:t.length*7})}, L.p[f]||'（未填写）', W-pad*2-120).length*20;
    });
    estH+=24; // 时限+负责人
    estH+=Math.max(L.p.tasks.length,1)*24; // 行动
    estH+=24; // 间距
  });
  estH+=60; // 全部维度
  estH+=pad+60; // 底部品牌
  const H=Math.max(estH, 800);
  const c=document.createElement('canvas');
  c.width=W*scale; c.height=H*scale;
  const ctx=c.getContext('2d');
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  let y=pad;
  // 标题
  ctx.fillStyle='#2d2a26'; ctx.font='700 26px '+FONT; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('平衡轮 · 追踪总览（'+activeMember().name+'）', pad, y);
  ctx.font='14px '+FONT; ctx.fillStyle='#8a8378'; ctx.textAlign='right';
  ctx.fillText('导出日期：'+ds, W-pad, y);
  y+=34;
  // 目标
  const g=state.goal||{};
  if(g.goal && g.goal.trim()){
    ctx.textAlign='left'; ctx.font='600 14px '+FONT; ctx.fillStyle=COLOR_A_D;
    ctx.fillText('🎯 目标', pad, y);
    y+=22;
    ctx.font='14px '+FONT; ctx.fillStyle='#3d382e';
    const gl=wrapText(ctx, g.goal, W-pad*2);
    gl.forEach(t=>{ ctx.fillText(t, pad, y); y+=20; });
    y+=10;
  }
  // 平衡轮
  drawWheelInto(ctx, wheelS, (W-wheelS)/2, y, {exportMode:true});
  y+=wheelS+30;
  // 提升维度
  y=drawSectionTitle(ctx, '提升维度与行动计划', pad, y);
  if(!lines.length){
    ctx.font='15px '+FONT; ctx.fillStyle='#8a8378';
    ctx.fillText('（暂无提升维度）', pad+20, y); y+=30;
  }
  lines.forEach((L,idx)=>{
    // 维度标题行
    ctx.font='700 16px '+FONT; ctx.fillStyle='#2d2a26';
    ctx.fillText((idx+1)+'. '+L.d.name, pad, y);
    ctx.font='600 13px '+FONT; ctx.fillStyle=COLOR_A_D;
    ctx.fillText('现状 '+L.d.current+' → 目标 '+L.d.target, pad+140, y);
    ctx.font='500 12px '+FONT; ctx.fillStyle='#8a8378';
    ctx.textAlign='right'; ctx.fillText(L.days, W-pad, y); ctx.textAlign='left';
    y+=26;
    // 进度条
    const barW=W-pad*2, barH=8;
    ctx.fillStyle='#efece4'; roundRect(ctx,pad,y,barW,barH,4); ctx.fill();
    ctx.fillStyle=COLOR_B; roundRect(ctx,pad,y,barW*L.pct/100,barH,4); ctx.fill();
    y+=24;
    // SMART 表格
    ctx.font='600 12px '+FONT; ctx.fillStyle='#8a8378';
    ctx.fillText('SMART 行动计划', pad, y); y+=22;
    const smFields=[['S · 具体',L.p.specific],['M · 可衡量',L.p.measurable],['A · 可实现',L.p.achievable],['R · 强相关',L.p.relevant],['T · 有时限',L.p.deadline],['负责人',L.p.owner]];
    smFields.forEach(([label,val])=>{
      ctx.font='600 12px '+FONT; ctx.fillStyle='#5d5442';
      ctx.textAlign='right'; ctx.fillText(label, pad+92, y); ctx.textAlign='left';
      ctx.font='13px '+FONT; ctx.fillStyle=val?'#3d382e':'#b0a99c';
      const txt=wrapText(ctx, val||'（未填写）', W-pad*2-130);
      txt.forEach((t,i)=>{ ctx.fillText(t, pad+104, y+i*20); });
      y+=Math.max(txt.length*20, 20)+6;
    });
    // 行动清单
    ctx.font='600 12px '+FONT; ctx.fillStyle='#8a8378';
    ctx.fillText('行动清单（'+L.done+'/'+L.total+'）', pad, y); y+=22;
    if(!L.p.tasks.length){
      ctx.font='13px '+FONT; ctx.fillStyle='#b0a99c';
      ctx.fillText('（暂无行动项）', pad+16, y); y+=24;
    }else{
      L.p.tasks.forEach((t,ti)=>{
        const mark=t.done?'✓':'○';
        ctx.font='700 13px '+FONT; ctx.fillStyle=t.done?COLOR_B:'#2d2a26';
        ctx.fillText(mark, pad+16, y);
        ctx.font='13px '+FONT; ctx.fillStyle=t.done?'#8a8378':'#3d382e';
        const prefix=(ti+1)+'. ';
        const txt=wrapText(ctx, prefix+(t.text||'（未填写）'), W-pad*2-54);
        txt.forEach((s,i)=>{ ctx.fillText(s, pad+34, y+i*20); });
        y+=Math.max(txt.length*20, 20)+4;
      });
    }
    y+=28;
  });
  // 全部维度
  y=drawSectionTitle(ctx, '全部维度现状', pad, y);
  const sumLine=state.dims.map(d=>d.name+' '+d.current).join('　');
  ctx.font='14px '+FONT; ctx.fillStyle='#5d5442';
  const sumLines=wrapText(ctx, sumLine, W-pad*2);
  sumLines.forEach(t=>{ ctx.fillText(t, pad, y); y+=22; });
  y+=30;
  // 品牌
  ctx.font='12px '+FONT; ctx.fillStyle='#8a8378'; ctx.textAlign='center';
  ctx.fillText('飞昂叩启教练学院 · 平衡轮　　8d.3mcoach.cn', W/2, y);
  return c;
}
async function saveCanvasAsImage(c){
  const ds=fmtDate(Date.now());
  const name='平衡轮-'+activeMember().name+'-'+ds+'.png';
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'平衡轮'}); toast('已调起系统分享'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a');
  a.download=name; a.href=URL.createObjectURL(blob);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('长图已开始下载，请到相册或文件中查看');
}
async function exportLongImage(){
  toast('正在生成长图…');
  await new Promise(r=>setTimeout(r,50));
  const c=buildLongCanvas();
  await saveCanvasAsImage(c);
}
async function exportPDF(){
  if(typeof jspdf==='undefined' || !window.jspdf){
    toast('PDF 组件加载失败，请检查网络后重试'); return;
  }
  toast('正在生成 PDF…');
  await new Promise(r=>setTimeout(r,50));
  const c=buildLongCanvas();
  const imgData=c.toDataURL('image/png');
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:'p', unit:'mm', format:'a4'});
  const pageW=210, pageH=297, margin=12;
  const imgW=pageW-margin*2;
  const imgH=c.height*imgW/c.width;
  let heightLeft=imgH, position=margin;
  pdf.addImage(imgData,'JPEG',margin,position,imgW,imgH);
  heightLeft-=(pageH-margin*2);
  while(heightLeft>0){
    pdf.addPage();
    position=margin-(imgH-heightLeft);
    pdf.addImage(imgData,'PNG',margin,position,imgW,imgH);
    heightLeft-=(pageH-margin*2);
  }
  const ds=fmtDate(Date.now());
  pdf.save('平衡轮-'+activeMember().name+'-'+ds+'.pdf');
  toast('PDF 已开始下载');
}

/* ================= 初始化 ================= */
(function init(){
  loadStore();
  state=activeMember().state;
  const params=new URLSearchParams(location.search);
  if(params.get('demo')==='1') seedDemo();
  /* 从「理解六层次」跳转进来：以对方名字新建一个空白成员（不动已有成员数据），话题预填为目标 */
  const newName=(params.get('new')||'').trim();
  if(newName){
    const m=newMember(newName.slice(0,20));
    const g=(params.get('goal')||'').trim();
    if(g) m.state.goal.goal=g.slice(0,200);
    store.members.push(m); store.active=m.id; state=m.state;
    try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
    setTimeout(()=>toast('已为「'+m.name+'」新建一个空白平衡轮，你的目标已预填'),300);
  }
  const applyHash=()=>{ const m=location.hash.match(/step=([0-5])/); if(m){ state.step=+m[1]; render(false); } };
  applyHash();
  normalize(); save();
  render(false);
  window.addEventListener('hashchange', applyHash);
})();
